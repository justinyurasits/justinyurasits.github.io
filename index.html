<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction OS — Give your construction team time back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-kit/tokens.css">
<link rel="stylesheet" href="brand-kit/brand.css">
<link rel="stylesheet" href="/brand-kit/cos-header.css">
<link rel="stylesheet" href="/brand-kit/cos-footer.css">
<style>
/* Container */
.cos-container { max-width: 1280px; margin: 0 auto; padding-inline: clamp(24px, 6vw, 96px); }

/* Hero */
.hero-section { padding: 64px 0 0; }
.hero-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 56px;
  align-items: start;
}
.hero-col { display: flex; flex-direction: column; gap: 28px; }
.hero-eyebrow {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 26px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-ink);
}
.hero-eyebrow i { flex: 1; height: 1px; background: var(--c-line); font-style: normal; }
.hero-title {
  margin: 0;
  max-width: 22ch;
  font-family: var(--font-display);
  font-size: clamp(38px, 5.4vw, 68px);
  font-weight: 600;
  line-height: 0.98;
  letter-spacing: -0.042em;
  color: var(--c-ink);
  text-wrap: balance;
}
.hero-body {
  margin: 0;
  max-width: 46ch;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--c-graphite);
}
.hero-kicker {
  border-left: 2px solid var(--c-steel);
  padding-left: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.hero-kicker p { margin: 0; font-family: var(--font-display); font-size: 15px; line-height: 1.5; }
.hero-kicker p:first-child { font-weight: 400; color: var(--c-graphite); }
.hero-kicker p:last-child { font-weight: 600; letter-spacing: -0.01em; color: var(--c-ink); }
.hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }
.hero-btn {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 15px 26px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.01em;
  text-decoration: none;
  border: 1px solid transparent;
}
.hero-btn--primary { background: var(--c-ink); color: var(--c-white); border-color: var(--c-ink); }
.hero-btn--primary:hover { background: var(--c-steel); border-color: var(--c-steel); color: var(--c-white); }
.hero-btn--ghost { border-color: var(--c-ink); color: var(--c-ink); background: transparent; }
.hero-btn--ghost:hover { background: var(--c-ink); color: var(--c-white); }
.hero-doc-fig { display: flex; flex-direction: column; gap: 12px; }
.hero-doc-cap {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 26px;
  font: 400 11px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  letter-spacing: 0.04em;
  color: var(--c-graphite);
  text-transform: uppercase;
  white-space: nowrap;
}
.hero-doc-cap span + span { color: var(--c-steel); }
.hero-doc {
  position: relative;
  height: 520px;
  overflow: hidden;
  border: 1px solid var(--c-ink);
  background: var(--c-white);
}
.hero-doc__corner { position: absolute; width: 14px; height: 14px; }
.hero-doc__corner--tr { top: 10px; right: 10px; border-top: 2px solid var(--c-line); border-right: 2px solid var(--c-line); }
.hero-doc__corner--bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--c-line); border-left: 2px solid var(--c-line); }
.hero-doc img { display: block; width: 100%; height: auto; }
.hero-doc-stack {
  position: relative;
  margin-right: 16px;
  margin-bottom: 16px;
}
.hero-doc-sheet {
  position: absolute;
  inset: 0;
  border: 1px solid var(--c-ink);
  background: var(--c-white);
}
.hero-doc-sheet:nth-child(1) { transform: translate(16px, 16px); z-index: 0; }
.hero-doc-sheet:nth-child(2) { transform: translate(8px,  8px);  z-index: 1; }
.hero-doc-sheet span {
  position: absolute;
  top: 8px; right: 10px;
  font: 400 11px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: var(--c-graphite);
}
.hero-doc-stack .cos-doc { position: relative; z-index: 2; }
.hero-doc__fade {
  position: absolute;
  inset: auto 0 0 0;
  height: 84px;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,255,255,0), #ffffff 62%);
}
.hero-doc__foot {
  position: absolute;
  inset: auto 0 0 0;
  border-top: 1px solid var(--c-line);
  background: var(--c-white);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font: 400 11px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: var(--c-graphite);
}
.hero-doc__foot a {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--c-ink);
  text-decoration: none;
  border-bottom: 1px solid var(--c-ink);
}
.hero-doc__foot a:hover { color: var(--c-steel); border-bottom-color: var(--c-steel); }
.hero-fold {
  margin: 60px 0 0;
  padding: 0;
  list-style: none;
  border-top: 2px solid var(--c-ink);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px,100%), 1fr));
  column-gap: 40px;
}
.hero-fold li {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 22px 0;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.015em;
  color: var(--c-ink);
}
.hero-fold li a { color: inherit; text-decoration: none; }
.hero-fold li a:hover { color: var(--c-steel); }
.hero-fold li span {
  font: 400 11px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  letter-spacing: 0;
  color: var(--c-graphite);
  font-variant-numeric: tabular-nums;
}

/* Proof band */
.proof-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.proof-cell {
  padding: var(--s-7) var(--s-6);
  display: flex;
  flex-direction: column;
}
.proof-cell + .proof-cell {
  border-left: var(--w-dimension) solid var(--rule-dimension);
}
.proof-cell__figure {
  margin: 0 0 var(--s-3);
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1.25;
  color: var(--fg);
}
.proof-cell__body {
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg-muted);
  margin: 0;
  max-width: 26ch;
}

/* Spec list — problems */
.spec-list { border-bottom: var(--w-dimension) solid var(--rule-dimension); margin-top: var(--s-6); }
.spec-row {
  display: grid;
  grid-template-columns: 2fr 5fr 5fr;
  gap: var(--s-6);
  padding-block: var(--s-5);
  border-top: var(--w-dimension) solid var(--rule-dimension);
  align-items: start;
}
.spec-row p { margin: 0; }

/* Step list — change order */
.step-list { border-bottom: var(--w-dimension) solid var(--rule-dimension); }
.step-row {
  display: grid;
  grid-template-columns: var(--s-7) 1fr;
  gap: var(--s-4);
  padding-block: var(--s-4);
  border-top: var(--w-dimension) solid var(--rule-dimension);
  align-items: start;
}
.step-row p { margin: 0; }

/* Configuration section */
/* Configuration section — ledger */
.cfg-section { padding-block: 72px 80px; }
.cfg-eyebrow {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-steel);
  margin: 0 0 16px;
}
.cfg-head {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--s-6);
  align-items: end;
  border-bottom: 2px solid var(--c-ink);
  padding-bottom: 26px;
  margin-bottom: 44px;
}
.cfg-title {
  font-family: var(--font-display);
  font-size: clamp(32px, 4.4vw, 48px);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: var(--c-ink);
  text-wrap: balance;
  max-width: 15ch;
  margin: 0;
}
.cfg-deck {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--c-graphite);
  max-width: 34ch;
  margin: 0;
}
.cfg-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.cfg-group {
  display: flex;
  flex-direction: column;
  padding: 0 36px;
  border-left: 1px solid var(--c-line);
  min-width: 0;
}
.cfg-group:first-child { padding-left: 0; border-left: none; }
.cfg-group:last-child { padding-right: 0; }
.cfg-group-label {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-ink);
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 30px;
}
.cfg-dot { width: 7px; height: 7px; flex: none; background: var(--c-ink); }
.cfg-dot--rev { background: var(--c-revision); }
.cfg-row { display: flex; gap: 16px; }
.cfg-rule { border: none; height: 1px; background: var(--c-line); margin: 26px 0; }
.cfg-row-n {
  flex: none;
  padding-top: 5px;
  font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  font-size: 12px;
  font-weight: 400;
  line-height: 1;
  color: var(--c-line);
  font-variant-numeric: tabular-nums;
}
.cfg-row-n--rev { color: var(--c-revision); padding-top: 7px; }
.cfg-row-t {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  line-height: 1.45;
  letter-spacing: -0.01em;
  color: var(--c-ink);
  text-wrap: pretty;
  margin: 0;
}
.cfg-row-t--lead {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.02em;
}
@media (max-width: 900px) {
  .cfg-section { padding-block: 56px 64px; }
  .cfg-group { padding: 32px 0; border-left: none; border-top: 1px solid var(--c-line); }
  .cfg-group:first-child { padding-top: 0; border-top: none; }
}

/* Familiar section — four-row ledger */
.fam-section {
  padding-block: 72px 76px;
  --fam-hairline: var(--c-steel);
  --fam-red: transparent;
}
.fam-head {
  display: grid;
  gap: 32px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  align-items: end;
  border-bottom: 2px solid var(--c-ink);
  padding-bottom: 24px;
  margin-bottom: 40px;
}
.fam-eyebrow {
  margin: 0 0 14px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--c-steel);
}
.fam-title {
  margin: 0;
  max-width: 18ch;
  font-family: var(--font-display);
  font-size: clamp(30px, 4.6vw, 44px);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: var(--c-ink);
  text-wrap: balance;
}
.fam-count {
  margin: 0;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--c-graphite);
}
.fam-pain {
  display: grid;
  column-gap: 28px;
  align-items: start;
  grid-template-columns: 46px minmax(160px, .7fr) minmax(240px, 1.3fr) minmax(240px, 1.3fr);
  padding: 30px 0;
}
.fam-pain:first-child { padding-top: 0; }
.fam-pain:last-child { padding-bottom: 0; }
.fam-rule { border: 0; height: 1px; background: var(--c-line); margin: 0; }
.fam-n {
  padding-top: 8px;
  font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: var(--c-graphite);
  font-variant-numeric: tabular-nums;
}
.fam-cat {
  margin: 0;
  padding-top: 4px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-ink);
}
.fam-cat svg { flex: none; }
.fam-stmt {
  margin: 0;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--c-ink);
  text-wrap: pretty;
}
.fam-detail {
  margin: 0;
  padding-top: 4px;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--c-graphite);
  text-wrap: pretty;
}
.fam-answer {
  margin-top: 40px;
  background: var(--c-ink);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  --fam-hairline: var(--c-line);
  --fam-red: var(--c-revision);
}
.fam-answer p {
  margin: 0;
  padding: 26px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-left: 1px solid var(--c-graphite);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.015em;
  color: var(--c-white);
}
.fam-answer p:first-child { border-left: 0; }
.fam-answer svg { flex: none; color: var(--c-white); }
@media (max-width: 900px) {
  .fam-section { padding-block: 56px 64px; }
  .fam-pain { grid-template-columns: 1fr; row-gap: 14px; }
  .fam-n { padding-top: 0; }
  .fam-answer p { border-left: 0; border-top: 1px solid var(--c-graphite); }
  .fam-answer p:first-child { border-top: 0; }
}

/* Real-world proof */
.prf-intro {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
  gap: 40px;
  align-items: start;
  margin-bottom: 40px;
}
.prf-intro-head-cell { container-type: inline-size; min-width: 0; }
.prf-intro-head {
  font: 600 clamp(26px, 7cqi, 38px)/1.08 var(--font-display), sans-serif;
  letter-spacing: -0.032em;
  color: var(--c-ink);
  text-wrap: balance;
  margin: 0;
  max-width: 22ch;
}
.prf-intro-copy {
  font: 400 16px/1.6 var(--font-display), sans-serif;
  color: var(--c-graphite);
  margin: 0;
  max-width: 44ch;
  text-wrap: pretty;
}
.prf-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
  column-gap: 40px;
  border-top: 2px solid var(--c-ink);
  align-items: start;
}
.prf-stat {
  padding: 26px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-right: 1px solid var(--c-line);
}
.prf-stat:last-child { border-right: none; }
.prf-before {
  font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  letter-spacing: .04em;
  color: var(--c-graphite);
  margin: 0;
}
.prf-figure {
  font: 600 38px/1 var(--font-display), sans-serif;
  letter-spacing: -0.035em;
  color: var(--c-ink);
  margin: 0;
}
.prf-figure--red { color: var(--c-revision); }
.prf-label {
  font: 400 14px/1.5 var(--font-display), sans-serif;
  color: var(--c-graphite);
  margin: 0;
}
.prf-foot {
  margin-top: 32px;
  padding-top: 18px;
  border-top: 1px solid var(--c-line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.prf-case { font: 400 11px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--c-graphite); }
.prf-case-link { font: 600 14px/1 var(--font-display), sans-serif; letter-spacing: -.01em; color: var(--c-ink); text-decoration: none; border-bottom: 2px solid var(--c-ink); padding-bottom: 2px; }
.prf-case-link:hover { color: var(--c-steel); border-bottom-color: var(--c-steel); }
@media (max-width: 600px) {
  .prf-grid { grid-template-columns: 1fr; }
  .prf-stat { border-bottom: 1px solid var(--c-line); border-right: none; }
  .prf-stat:last-child { border-bottom: 0; }
  .prf-foot { flex-direction: column; gap: 12px; }
}

/* Products — shared intro grammar */
.prod-section { padding: 72px 0 64px; }
.prod-split {
  display: grid;
  grid-template-columns: minmax(340px, 1fr) minmax(340px, 1.15fr);
  gap: 48px;
  align-items: start;
}

.prod-index {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-family: var(--font-display);
  font-size: var(--fs-annotation);
  letter-spacing: var(--tr-annotation);
  color: var(--fg-muted);
  margin: 0;
}
.prod-index::after {
  content: '';
  display: block;
  flex: 1;
  border-top: var(--w-cut) solid var(--rule-cut);
}
.prod-intro { container-type: inline-size; }
.prod-name {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4em;
  font: 600 clamp(22px, 7.2cqi, 38px)/1.05 var(--font-display), sans-serif;
  letter-spacing: -.032em;
  white-space: nowrap;
  color: var(--c-ink);
  margin: 0;
}
.prod-name svg { width: .72em; height: .72em; flex: none; }
.cos-tag--dev {
  border: 1px solid var(--c-steel);
  color: var(--c-steel);
  background: none;
  font: 600 11px/1 var(--font-display), sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 4px 8px;
  white-space: nowrap;
}
.prod-promise {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 500;
  line-height: 1.4;
  letter-spacing: -0.015em;
  color: var(--c-ink);
  margin: var(--s-5) 0 0;
  max-width: 34ch;
  text-wrap: balance;
}
.prod-body {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--c-graphite);
  margin: var(--s-4) 0 0;
  max-width: 46ch;
}
/* Document Workbench section */
.cos-products { background: var(--c-white); padding: 72px 0 64px; }
.cos-products__head { margin-bottom: 30px; }
.cos-products__head h2 { margin: 0 0 12px; display: flex; align-items: center; gap: 16px; font: 600 clamp(34px, 5vw, 52px)/1 var(--font-display), sans-serif; letter-spacing: -.035em; color: var(--c-ink); }
.cos-products__head p { margin: 0; font: 500 20px/1.4 var(--font-display), sans-serif; letter-spacing: -.015em; color: var(--c-graphite); }
.cos-index { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border-top: 2px solid var(--c-ink); border-bottom: 1px solid var(--c-line); }
.cos-index a { display: flex; flex-direction: column; gap: 12px; padding: 20px 28px 22px; border-left: 1px solid var(--c-line); text-decoration: none; }
.cos-index li:first-child a { padding-left: 0; border-left: 0; }
.cos-index__n { font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; color: var(--c-ink); }
.cos-index__layer { font: 600 11px/1 var(--font-display), sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--c-steel); }
.cos-index__promise { font: 600 20px/1.25 var(--font-display), sans-serif; letter-spacing: -.02em; color: var(--c-ink); }
.cos-index__product { font: 500 13px/1 var(--font-display), sans-serif; color: var(--c-graphite); }
.cos-index a:hover .cos-index__promise { color: var(--c-steel); }
.cos-product { display: grid; grid-template-columns: minmax(340px, 1fr) minmax(340px, 1.15fr); gap: 48px; align-items: start; }
.cos-product__col { display: flex; flex-direction: column; gap: 26px; min-width: 0; container-type: inline-size; }

  font-size: 15px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--c-graphite);
  text-wrap: pretty;
}
.ops-hr { border: none; height: 1px; background: var(--c-line); margin: 0; }
.ops-foot {
  margin-top: 56px;
  padding: 22px 0 30px;
  border-top: 1px solid var(--c-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.ops-foot p { margin: 0; font-family: var(--font-display); font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--c-graphite); }
.ops-foot a {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -0.01em;
  color: var(--c-ink);
  text-decoration: none;
  border-bottom: 2px solid var(--c-ink);
  padding-bottom: 3px;
}
.ops-foot a:hover { color: var(--c-steel); border-bottom-color: var(--c-steel); }

/* Closing CTA */
.cos-close { background: #111111; padding: 88px 0 80px; }
.cos-close__grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 56px; align-items: start;
}
.cos-close__col { container-type: inline-size; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.cos-close__lockup { display: flex; align-items: center; gap: 10px; min-height: 26px; }
.cos-close__lockup-name { font: 600 14px/1 var(--font-display), sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ffffff; white-space: nowrap; }
.cos-close__lockup-rule { flex: 1; height: 1px; background: #5F6466; }
.cos-close__headline { font: 600 clamp(34px, 12cqi, 76px)/0.98 var(--font-display), sans-serif; letter-spacing: -.042em; color: #ffffff; text-wrap: balance; margin: 0; }
.cos-close__subhead { font: 400 19px/1.55 var(--font-display), sans-serif; color: #B8B9B5; max-width: 44ch; margin: 0; }
.cos-close__cta { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.cos-close__btn-primary { display: inline-flex; align-items: center; min-height: 48px; padding: 15px 26px; font: 600 15px/1 var(--font-display), sans-serif; letter-spacing: -.01em; text-decoration: none; background: #ffffff; color: #111111; }
.cos-close__btn-link { font: 600 15px/1 var(--font-display), sans-serif; letter-spacing: -.01em; color: #ffffff; text-decoration: none; border-bottom: 2px solid #ffffff; padding-bottom: 3px; }
.cos-close__index-label { font: 500 12px/1 var(--font-display), sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #B8B9B5; margin: 0; }
.cos-close__index-rule { height: 1px; background: #5F6466; }
.cos-close__index-row { display: flex; align-items: center; gap: 14px; padding: 18px 0; border-bottom: 1px solid #5F6466; }
.cos-close__index-row:last-child { border-bottom: 0; }
.cos-close__index-n { font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; color: #B8B9B5; flex-shrink: 0; }
.cos-close__index-name { font: 600 17px/1.2 var(--font-display), sans-serif; letter-spacing: -.015em; color: #ffffff; }
.cos-close__index-tag { border: 1px solid #5F6466; color: #B8B9B5; font: 600 10px/1 var(--font-display), sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 3px 6px; white-space: nowrap; }
.cos-close__index-ext { font: 500 10px/1 var(--font-display), sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #B8B9B5; white-space: nowrap; }

/* Responsive */
@media (max-width: 1023px) {
  .proof-strip { grid-template-columns: repeat(2, 1fr); }
  .proof-cell:nth-child(3) { border-left: none; border-top: var(--w-dimension) solid var(--rule-dimension); }
  .proof-cell:nth-child(4) { border-top: var(--w-dimension) solid var(--rule-dimension); }
}
@media (max-width: 900px) {
  .prod-split,
  .cos-product { grid-template-columns: 1fr; gap: 32px; }
  .prod-section,
  .cos-products { padding: 56px 0 48px; }
  .cos-close { padding: 64px 0 56px; }
  .cos-index a { padding-left: 0; border-left: 0; border-top: 1px solid var(--c-line); }
  .cos-index li:first-child a { border-top: 0; }
  .cos-doc { height: 420px; }
  .ci-body { grid-template-columns: 1fr; }
  .ci-sources { border-left: none; border-top: 1px solid var(--c-line); }
  .hero-doc { height: 380px; }
.ops-block { padding-top: 56px; }
  .ops-col--divided { border-left: none; padding-left: 0; border-top: 1px solid var(--c-line); margin-top: 8px; }
  .ops-col--divided .ops-cap { display: none; }
}
@media (max-width: 600px) {
  .prod-name { white-space: normal; }
  .dw-artifact { grid-template-columns: 1fr; }
  .dw-rail { border-left: none; border-top: var(--w-cut) solid var(--c-ink); }
  .pi-table, .pi-table thead, .pi-table tbody, .pi-table tr, .pi-table td { display: block; }
  .pi-table thead { display: none; }
  .pi-table tr { display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--c-line); }
  .pi-table tbody tr:last-child { border-bottom: 0; }
  .pi-table td { border-bottom: none; padding: 0; width: auto !important; text-align: left; }
  .pi-col-age, .pi-col-status { display: inline; }
}
@media (max-width: 480px) {
  .proof-strip { grid-template-columns: 1fr; }
  .proof-cell + .proof-cell { border-left: none; border-top: var(--w-dimension) solid var(--rule-dimension); }
  .proof-cell:nth-child(3), .proof-cell:nth-child(4) { border-top: var(--w-dimension) solid var(--rule-dimension); }
}
@media (max-width: 899px) {
  .spec-row { grid-template-columns: 1fr; gap: var(--s-3); }
}

    toggle.setAttribute('aria-expanded', open);
  });

  if (dd) {
    var openTimer, closeTimer;

    function openPanel() {
      clearTimeout(closeTimer);
      dd.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
    }

    function closePanel() {
      clearTimeout(openTimer);
      dd.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      clearTimeout(openTimer); clearTimeout(closeTimer);
      dd.classList.contains('is-open') ? closePanel() : openPanel();
    });

    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dd.classList.contains('is-open') ? closePanel() : openPanel(); }
    });

    dd.addEventListener('mouseenter', function () {
      if (window.innerWidth < 900) return;
      clearTimeout(closeTimer);
      openTimer = setTimeout(openPanel, 120);
    });

    dd.addEventListener('mouseleave', function () {
      if (window.innerWidth < 900) return;
      clearTimeout(openTimer);
      closeTimer = setTimeout(closePanel, 200);
    });

    btn.addEventListener('keydown', function (e) {
      if (!dd.classList.contains('is-open')) return;
      var items = Array.prototype.slice.call(panel.querySelectorAll('.cos-nav__item'));
      if (e.key === 'ArrowDown') { e.preventDefault(); if (items[0]) items[0].focus(); }
      if (e.key === 'Escape') { closePanel(); btn.focus(); }
    });

    panel.addEventListener('keydown', function (e) {
      var items = Array.prototype.slice.call(panel.querySelectorAll('.cos-nav__item'));
      var idx = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); if (idx < items.length - 1) items[idx + 1].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); if (idx > 0) items[idx - 1].focus(); else btn.focus(); }
      if (e.key === 'Escape') { e.preventDefault(); closePanel(); btn.focus(); }
      if (e.key === 'Tab') { closePanel(); }
    });

    document.addEventListener('click', function (e) {
      if (!dd.contains(e.target)) closePanel();
    });
  }

  // Compact header on scroll
  window.addEventListener('scroll', function () {
    header.classList.toggle('cos-header--compact', window.scrollY > 40);
  }, { passive: true });

  var tbPage = document.getElementById('tb-page');
  if (tbPage) {
    var seg = location.pathname.replace(/\/$/, '').split('/').pop().replace(/\.html$/, '').toUpperCase();
    tbPage.textContent = seg || 'HOME';
  }
})();
