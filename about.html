<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About — Construction OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-kit/tokens.css">
<link rel="stylesheet" href="brand-kit/brand.css">
<link rel="stylesheet" href="/brand-kit/cos-header.css">
<link rel="stylesheet" href="/brand-kit/cos-footer.css">
<style>
.cos-container { max-width: 1280px; margin: 0 auto; padding-inline: clamp(24px, 6vw, 96px); }

/* ── About page ──────────────────────────────────────────── */
/* Surfaces */
.ab-paper { background: #FFFFFF; }
.ab-bond  { background: #EFEFEB; }
.ab-ink   { background: #111111; color: #FFFFFF; }

/* Section spacing */
.ab-section         { padding: 76px 0 80px; }
.ab-section--hero   { padding: 76px 0 64px; }
.ab-section--closing { padding: 88px 0 80px; }

/* Eyebrow */
.ab-eyebrow {
  margin: 0; font: 600 11px/1 var(--font-display), sans-serif;
  letter-spacing: .16em; text-transform: uppercase; color: #476776;
}

/* §1 Hero */
.ab-hero-col {
  max-width: 64ch; container-type: inline-size;
  display: flex; flex-direction: column; gap: 26px;
}
.ab-hero-tag {
  display: flex; align-items: center; gap: 10px;
  font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: #111111;
}
.ab-hero-tag__rule { flex: none; width: 40px; height: 1px; background: #111111; }
.ab-hero-tag__label {
  font: 600 11px/1 var(--font-display), sans-serif;
  letter-spacing: .16em; text-transform: uppercase; color: #476776; margin: 0;
}
.ab-hero-h1 {
  margin: 0; font: 600 clamp(30px, 9cqi, 48px)/1.02 var(--font-display), sans-serif;
  letter-spacing: -.038em; color: #111111; text-wrap: balance;
}
.ab-hero-lead {
  margin: 0; font: 500 18px/1.4 var(--font-display), sans-serif;
  letter-spacing: -.018em; color: #111111; max-width: 52ch;
}
.ab-hero-body {
  margin: 0; font: 400 17px/1.6 var(--font-display), sans-serif;
  color: #5F6466; max-width: 56ch;
}
.ab-hero-kicker {
  border-left: 2px solid #476776; padding-left: 16px;
  font: 600 18px/1.35 var(--font-display), sans-serif; color: #111111; margin: 0;
}

/* §2 Two-column (The Turn) */
.ab-two-col {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
  gap: 28px 48px; align-items: start;
}
.ab-col-left { display: flex; flex-direction: column; gap: 16px; }
.ab-col-right { display: flex; flex-direction: column; gap: 18px; }
.ab-section-h2 {
  margin: 0; font: 600 clamp(28px, 8cqi, 42px)/1.05 var(--font-display), sans-serif;
  letter-spacing: -.035em; color: #111111; text-wrap: balance;
}
.ab-prose-500 { margin: 0; font: 500 17px/1.6 var(--font-display), sans-serif; color: #111111; }
.ab-prose-400 { margin: 0; font: 400 17px/1.6 var(--font-display), sans-serif; color: #5F6466; }

/* §3 Head block */
.ab-head-block {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
  gap: 28px 48px; align-items: end;
  border-bottom: 2px solid #111111; padding-bottom: 30px; margin-bottom: 34px;
}
.ab-head-right { display: flex; flex-direction: column; gap: 10px; }
.ab-head-right p { margin: 0; }
.ab-text-500 { font: 500 17px/1.5 var(--font-display), sans-serif; color: #111111; }

/* §3 Findings grid */
.ab-findings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
  column-gap: 40px; list-style: none; padding: 0; margin: 0;
}
.ab-finding-cell {
  border-top: 1px solid #B8B9B5; padding: 20px 0;
  font: 500 16px/1.5 var(--font-display), sans-serif; color: #111111; margin: 0;
}

/* §3 Pull quote */
.ab-pull-quote {
  margin: 34px 0 0; padding-top: 30px; border-top: 2px solid #111111;
  font: 600 22px/1.25 var(--font-display), sans-serif;
  letter-spacing: -.024em; color: #111111; max-width: 48ch;
}

/* §4 Ink section */
.ab-ink-head {
  margin: 0 0 34px; font: 600 clamp(28px, 8cqi, 42px)/1.05 var(--font-display), sans-serif;
  letter-spacing: -.035em; color: #FFFFFF; text-wrap: balance; max-width: 38ch;
}
.ab-ledger-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
  gap: 0 28px;
}
.ab-ledger-row {
  display: flex; align-items: baseline; gap: 16px;
  padding: 22px 0; border-top: 1px solid #476776;
}
.ab-ledger-n {
  font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: #B8B9B5; flex: none; width: 28px;
}
.ab-ledger-text {
  font: 500 17px/1.55 var(--font-display), sans-serif; color: #FFFFFF; margin: 0;
}
.ab-ink-kicker {
  margin-top: 34px; padding-top: 30px; border-top: 2px solid #476776;
  font: 600 19px/1.35 var(--font-display), sans-serif; color: #FFFFFF; margin-bottom: 0;
}

/* §5 Questions grid */
.ab-q-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
  column-gap: 40px; list-style: none; padding: 0; margin: 0;
}
.ab-q-cell {
  border-top: 1px solid #B8B9B5; padding: 20px 0;
  font: 600 19px/1.35 var(--font-display), sans-serif;
  letter-spacing: -.02em; color: #111111; margin: 0;
}

/* §5 Product cards */
.ab-products-rule { margin-top: 34px; padding-top: 34px; border-top: 2px solid #111111; }
.ab-products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
  column-gap: 40px; row-gap: 34px;
  --cos-revision: #476776;
  --cos-hairline: #476776;
}
.ab-product-card {
  display: flex; flex-direction: column; gap: 12px;
  padding-top: 26px; border-top: 1px solid #B8B9B5;
}
.ab-product-card__icon-row {
  display: flex; align-items: center; gap: 10px;
}
.ab-product-card__name {
  margin: 0; font: 600 18px/1.2 var(--font-display), sans-serif;
  letter-spacing: -.018em; color: #111111;
}
.ab-product-card__desc {
  margin: 0; font: 400 15px/1.55 var(--font-display), sans-serif; color: #5F6466;
}
.ab-extension-line {
  margin-top: 28px; padding-top: 20px; border-top: 1px solid #B8B9B5;
  font: 400 15px/1.55 var(--font-display), sans-serif; color: #5F6466; margin-bottom: 0;
}

/* §6 Knowledge lists */
.ab-knowledge-grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 0 48px; align-items: start;
}
@media (max-width: 700px) {
  .ab-knowledge-grid { grid-template-columns: 1fr; gap: 32px 0; }
}
.ab-knowledge-col { display: flex; flex-direction: column; }
.ab-knowledge-head {
  font: 600 11px/1 var(--font-display), sans-serif;
  letter-spacing: .14em; text-transform: uppercase; color: #476776;
  margin: 0; padding-bottom: 12px; border-bottom: 1px solid #B8B9B5;
}
.ab-knowledge-item {
  display: flex; align-items: baseline; gap: 12px;
  padding: 13px 0; border-bottom: 1px solid #B8B9B5;
  font: 500 16px/1.4 var(--font-display), sans-serif; color: #111111; margin: 0;
}
.ab-knowledge-n {
  font: 400 11px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: #5F6466; flex: none; width: 24px;
}
.ab-knowledge-close {
  margin-top: 40px; font: 600 22px/1.25 var(--font-display), sans-serif;
  letter-spacing: -.022em; color: #111111; max-width: 52ch;
}

/* §7 Today section */
.ab-today-head { border-bottom: 2px solid #111111; padding-bottom: 26px; margin-bottom: 30px; }
.ab-sometimes-list { list-style: none; padding: 0; margin: 0; }
.ab-sometimes-line {
  font: 500 18px/1.4 var(--font-display), sans-serif; color: #111111;
  padding: 18px 0; border-top: 1px solid #B8B9B5; margin: 0; max-width: 64ch;
}
.ab-section-kicker {
  margin-top: 30px; border-left: 2px solid #476776; padding-left: 14px;
  font: 600 19px/1.35 var(--font-display), sans-serif; color: #111111;
}

/* §8 Closing CTA */
.ab-closing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
  gap: 36px 56px; align-items: start;
}
.ab-closing-col { container-type: inline-size; }
.ab-closing-lockup {
  display: flex; align-items: center; gap: 10px; margin-bottom: 28px;
}
.ab-closing-lockup__rule { flex: 1; height: 1px; background: #5F6466; }
.ab-closing-label {
  font: 600 14px/1 var(--font-display), sans-serif;
  letter-spacing: .14em; text-transform: uppercase; color: #FFFFFF; margin: 0; white-space: nowrap;
}
.ab-closing-h2 {
  margin: 0; font: 600 clamp(32px, 10cqi, 58px)/0.99 var(--font-display), sans-serif;
  letter-spacing: -.042em; color: #FFFFFF; text-wrap: balance;
}
.ab-candidates { list-style: none; padding: 0; margin: 24px 0; }
.ab-candidates li {
  font: 500 16px/1.4 var(--font-display), sans-serif; color: #FFFFFF;
  padding: 13px 0; border-top: 1px solid #5F6466;
}
.ab-cta-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.ab-btn-primary {
  display: inline-flex; align-items: center; min-height: 44px;
  padding: 13px 20px; font: 600 14px/1 var(--font-display), sans-serif;
  letter-spacing: -.01em; text-decoration: none;
  background: #FFFFFF; color: #111111;
  white-space: nowrap;
}
.ab-btn-primary:hover { background: #EFEFEB; }
.ab-btn-secondary {
  display: inline-flex; align-items: center; min-height: 40px;
  font: 600 14px/1 var(--font-display), sans-serif; letter-spacing: -.01em;
  text-decoration: none; color: #FFFFFF;
  border-bottom: 2px solid #FFFFFF; padding-bottom: 3px; white-space: nowrap;
}
.ab-btn-secondary:hover { color: #B8B9B5; border-bottom-color: #B8B9B5; }

/* §8 Background rail */
.ab-rail { display: flex; flex-direction: column; }
.ab-rail-label {
  font: 500 12px/1 var(--font-display), sans-serif; letter-spacing: .12em;
  text-transform: uppercase; color: #B8B9B5; margin: 0 0 16px;
}
.ab-rail-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 16px 0; border-top: 1px solid #5F6466;
}
.ab-rail-n {
  font: 400 12px/1 ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
  color: #B8B9B5; flex: none;
}
.ab-rail-stack { display: flex; flex-direction: column; gap: 4px; }
.ab-rail-name { margin: 0; font: 600 17px/1.2 var(--font-display), sans-serif; color: #FFFFFF; }
.ab-rail-detail { margin: 0; font: 400 14px/1.4 var(--font-display), sans-serif; color: #B8B9B5; }

    var open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open);
  });

  if (!dd) return;

  var openTimer, closeTimer;

  function openPanel() {
    clearTimeout(closeTimer);
    dd.classList.add('is-open');
    btn.setAttribute('aria-expanded', 'true');
  }

  function closePanel() {
    clearTimeout(openTimer);
    dd.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    clearTimeout(openTimer); clearTimeout(closeTimer);
    dd.classList.contains('is-open') ? closePanel() : openPanel();
  });

  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dd.classList.contains('is-open') ? closePanel() : openPanel(); }
  });

  dd.addEventListener('mouseenter', function () {
    if (window.innerWidth < 900) return;
    clearTimeout(closeTimer);
    openTimer = setTimeout(openPanel, 120);
  });

  dd.addEventListener('mouseleave', function () {
    if (window.innerWidth < 900) return;
    clearTimeout(openTimer);
    closeTimer = setTimeout(closePanel, 200);
  });

  btn.addEventListener('keydown', function (e) {
    if (!dd.classList.contains('is-open')) return;
    var items = Array.prototype.slice.call(panel.querySelectorAll('.cos-nav__item'));
    if (e.key === 'ArrowDown') { e.preventDefault(); if (items[0]) items[0].focus(); }
    if (e.key === 'Escape') { closePanel(); btn.focus(); }
  });

  panel.addEventListener('keydown', function (e) {
    var items = Array.prototype.slice.call(panel.querySelectorAll('.cos-nav__item'));
    var idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); if (idx < items.length - 1) items[idx + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (idx > 0) items[idx - 1].focus(); else btn.focus(); }
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); btn.focus(); }
    if (e.key === 'Tab') { closePanel(); }
  });

  document.addEventListener('click', function (e) {
    if (!dd.contains(e.target)) closePanel();
  });
})();
</script>

</body>
</html>
