<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services — Construction OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand-kit/tokens.css">
<link rel="stylesheet" href="brand-kit/brand.css">
<link rel="stylesheet" href="/brand-kit/cos-header.css">
<link rel="stylesheet" href="/brand-kit/cos-footer.css">
<style>
.cos-container { max-width: 1280px; margin: 0 auto; padding-inline: clamp(24px, 6vw, 96px); }

/* ── Services page ────────────────────────────────────── */
/* Surfaces */
.srv-paper { background:#FFFFFF; }
.srv-bond  { background:#EFEFEB; }
.srv-ink   { background:#111111; color:#FFFFFF; }

/* Section spacing */
.srv-section { padding: 76px 0 80px; }
.srv-section--hero { padding: 76px 0 64px; }
.srv-section--closing { padding: 88px 0 80px; }
.srv-section--thin { padding: 34px 0; }

/* Eyebrow */
.srv-eyebrow {
  margin:0; font: 600 11px/1 var(--font-display),sans-serif;
  letter-spacing:.16em; text-transform:uppercase; color:#476776;
}
.srv-eyebrow--limits { letter-spacing:.14em; }

/* Hero column */
.srv-hero-col {
  max-width:64ch; container-type:inline-size;
  display:flex; flex-direction:column; gap:26px;
}
.srv-hero-tag {
  display:flex; align-items:center; gap:10px;
  font: 400 12px/1 ui-monospace,'Cascadia Code','Source Code Pro',monospace;
  color:#111111;
}
.srv-hero-tag__rule { flex:none; width:40px; height:1px; background:#111111; }
.srv-hero-tag__label {
  font: 600 11px/1 var(--font-display),sans-serif;
  letter-spacing:.16em; text-transform:uppercase; color:#476776; margin:0;
}
.srv-hero-h1 {
  margin:0; font: 600 clamp(30px,9cqi,48px)/1.02 var(--font-display),sans-serif;
  letter-spacing:-.038em; color:#111111; text-wrap:balance;
}
.srv-hero-lead {
  margin:0; font: 500 20px/1.4 var(--font-display),sans-serif;
  letter-spacing:-.02em; color:#111111; max-width:46ch;
}
.srv-hero-body {
  margin:0; font: 400 17px/1.6 var(--font-display),sans-serif;
  color:#5F6466; max-width:56ch;
}
.srv-hero-kicker {
  border-left:2px solid #476776; padding-left:16px;
  font: 600 18px/1.35 var(--font-display),sans-serif; color:#111111; margin:0;
}

/* CTA row */
.srv-cta-row { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.srv-btn-primary {
  display:inline-flex; align-items:center; min-height:44px;
  padding:13px 20px; font: 600 14px/1 var(--font-display),sans-serif;
  letter-spacing:-.01em; text-decoration:none; background:#111111; color:#FFFFFF;
  border:none; cursor:pointer; white-space:nowrap;
}
.srv-btn-primary:hover { background:#476776; }
.srv-btn-secondary {
  display:inline-flex; align-items:center; min-height:40px;
  font: 600 14px/1 var(--font-display),sans-serif; letter-spacing:-.01em;
  text-decoration:none; color:#111111; border-bottom:2px solid #111111;
  padding-bottom:3px; background:none; border-top:none; border-left:none; border-right:none;
  cursor:pointer; white-space:nowrap;
}
.srv-btn-secondary:hover { color:#476776; border-bottom-color:#476776; }
/* Ink-surface CTAs */
.srv-ink .srv-btn-primary {
  background:#FFFFFF; color:#111111;
}
.srv-ink .srv-btn-primary:hover { background:#EFEFEB; }
.srv-ink .srv-btn-secondary { color:#FFFFFF; border-bottom-color:#FFFFFF; }
.srv-ink .srv-btn-secondary:hover { color:#B8B9B5; border-bottom-color:#B8B9B5; }

/* ── Section heading block ──────────────────────────── */
.srv-head-block {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px,100%),1fr));
  gap:28px 48px; align-items:end;
  border-bottom:2px solid #111111; padding-bottom:30px; margin-bottom:34px;
}
.srv-head-block--pb26 { padding-bottom:26px; margin-bottom:30px; }

.srv-section-h2 {
  margin:0; font: 600 clamp(28px,8cqi,42px)/1.05 var(--font-display),sans-serif;
  letter-spacing:-.035em; color:#111111; text-wrap:balance;
}
.srv-section-h2--sm {
  font-size:clamp(26px,7cqi,38px); letter-spacing:-.032em; line-height:1.05;
}
.srv-head-right { display:flex; flex-direction:column; gap:10px; }
.srv-head-right p { margin:0; }
.srv-text-500 { font: 500 17px/1.5 var(--font-display),sans-serif; color:#111111; }
.srv-text-400-graphite { font: 400 16px/1.6 var(--font-display),sans-serif; color:#5F6466; }

/* ── Marker row (service headings) ─────────────────── */
.srv-marker-row {
  display:flex; align-items:center; gap:12px; margin-bottom:12px;
}
.srv-marker-n {
  font: 400 12px/1 ui-monospace,'Cascadia Code','Source Code Pro',monospace; color:#111111;
}
.srv-marker-label {
  font: 600 11px/1 var(--font-display),sans-serif;
  letter-spacing:.16em; text-transform:uppercase; color:#476776; margin:0;
}
.srv-service-h2 {
  margin:0; font: 600 clamp(26px,7.5cqi,40px)/1.05 var(--font-display),sans-serif;
  letter-spacing:-.034em; color:#111111; text-wrap:balance;
}

/* ── Divided item grids (signals, questions, reasons) ─ */
.srv-item-grid {
  display:grid;
  column-gap:40px;
}
.srv-item-grid--signals { grid-template-columns: repeat(auto-fit, minmax(min(300px,100%),1fr)); }
.srv-item-grid--questions { grid-template-columns: repeat(auto-fit, minmax(min(280px,100%),1fr)); }
.srv-item-grid--reasons { grid-template-columns: repeat(auto-fit, minmax(min(280px,100%),1fr)); }
.srv-item-grid--inputs { grid-template-columns: repeat(auto-fit, minmax(min(240px,100%),1fr)); column-gap:32px; }

.srv-signal-cell {
  border-top:1px solid #B8B9B5; padding:18px 0;
  font: 500 16px/1.5 var(--font-display),sans-serif; color:#111111; margin:0;
}
.srv-q-cell {
  border-top:1px solid #B8B9B5; padding:20px 0;
  font: 600 19px/1.35 var(--font-display),sans-serif; letter-spacing:-.02em; color:#111111; margin:0;
}
.srv-reason-cell {
  border-top:1px solid #B8B9B5; padding:20px 0;
  font: 600 19px/1.35 var(--font-display),sans-serif; letter-spacing:-.02em; color:#111111; margin:0;
}
.srv-input-cell {
  display:flex; align-items:baseline; gap:12px;
  border-top:1px solid #B8B9B5; padding:14px 0;
}
.srv-input-n {
  font: 400 11px/1 ui-monospace,'Cascadia Code','Source Code Pro',monospace;
  color:#5F6466; flex:none;
}
.srv-input-label { font: 500 16px/1.4 var(--font-display),sans-serif; color:#111111; margin:0; }

/* ── Section close (two-column under Ink rule) ──────── */
.srv-section-close {
  margin-top:30px; padding-top:30px; border-top:2px solid #111111;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px,100%),1fr));
  gap:28px 48px; align-items:start;
}
.srv-close-stack { display:flex; flex-direction:column; }
.srv-close-stack--8 { gap:8px; }
.srv-close-stack--10 { gap:10px; }
.srv-close-stack--12 { gap:12px; }
.srv-close-left-h { margin:0; font: 600 22px/1.2 var(--font-display),sans-serif; letter-spacing:-.024em; color:#111111; }
.srv-close-left-sm { margin:0; font: 400 16px/1.5 var(--font-display),sans-serif; color:#5F6466; }
.srv-close-right-500 { margin:0; font: 500 17px/1.5 var(--font-display),sans-serif; color:#111111; }
.srv-close-right-600 { margin:0; font: 600 19px/1.35 var(--font-display),sans-serif; color:#111111; }
.srv-close-right-400 { margin:0; font: 400 16px/1.5 var(--font-display),sans-serif; color:#5F6466; }
.srv-close-outcome-sm { margin:0; font: 400 16px/1.5 var(--font-display),sans-serif; color:#5F6466; }
.srv-close-outcome-lg { margin:0; font: 600 19px/1.35 var(--font-display),sans-serif; color:#111111; }
.srv-typical-label {
  font: 600 11px/1 var(--font-display),sans-serif; letter-spacing:.14em;
  text-transform:uppercase; color:#5F6466; margin:0;
}
.srv-typical-body { margin:0; font: 400 15px/1.55 var(--font-display),sans-serif; color:#5F6466; }
.srv-typical-cta { margin:0; font: 500 16px/1.4 var(--font-display),sans-serif; color:#111111; padding-top:10px; border-top:1px solid #B8B9B5; }

/* ── §3 Index rows ──────────────────────────────────── */
.srv-index-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(300px,100%),1fr));
  gap:0 28px;
}
.srv-index-row {
  display:flex; align-items:baseline; gap:0;
  padding:24px 0; border-top:1px solid #B8B9B5;
}
.srv-index-row:first-child { border-top:none; }
.srv-index-cell1 { display:flex; align-items:baseline; gap:12px; flex:1; }
.srv-index-n {
  font: 400 12px/1 ui-monospace,'Cascadia Code','Source Code Pro',monospace;
  color:#5F6466; width:46px; flex:none;
}
.srv-index-name { margin:0; font: 600 21px/1.2 var(--font-display),sans-serif; letter-spacing:-.022em; color:#111111; }
.srv-index-promise { margin:0; font: 400 16px/1.5 var(--font-display),sans-serif; color:#5F6466; padding-top:4px; }

/* ── §5 Implementation + product cards ─────────────── */
.srv-impl-close {
  margin-top:26px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(260px,100%),1fr));
  gap:20px 48px; align-items:start;
}
.srv-kicker {
  border-left:2px solid #476776; padding-left:14px;
  font: 600 19px/1.35 var(--font-display),sans-serif; color:#111111; margin:0;
}
.srv-kicker--sm { font-size:17px; }
.srv-products-rule { margin-top:34px; padding-top:34px; border-top:2px solid #111111; }
.srv-products-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px,100%),1fr));
  column-gap:40px; row-gap:34px;
  /* Suppress red on these product-card icons — services page has zero red except mark plates */
  --cos-revision: #476776;
  --cos-hairline: #476776;
}
.srv-product-card {
  display:flex; flex-direction:column; gap:12px;
  padding-top:26px; border-top:1px solid #B8B9B5;
}
.srv-product-card__icon-row {
  display:flex; align-items:center; gap:10px;
}
.srv-product-card__name {
  margin:0; font: 600 18px/1.2 var(--font-display),sans-serif; letter-spacing:-.018em; color:#111111;
}
.srv-product-card__desc {
  margin:0; font: 400 15px/1.55 var(--font-display),sans-serif; color:#5F6466; flex:1;
}
.srv-product-card__link {
  font: 600 14px/1 var(--font-display),sans-serif; color:#111111;
  text-decoration:none; border-bottom:2px solid #111111; padding-bottom:2px;
  align-self:flex-start; width:fit-content;
}
.srv-product-card__link:hover { color:#476776; border-bottom-color:#476776; }

/* ── §6 Custom Solutions ────────────────────────────── */
.srv-custom-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(320px,100%),1fr));
  gap:28px 48px; align-items:start;
}
.srv-custom-left { display:flex; flex-direction:column; }
.srv-custom-left-head { display:flex; flex-direction:column; gap:0; }
.srv-custom-divider { margin:28px 0 20px; border:0; height:1px; background:#B8B9B5; }
.srv-custom-right {
  border-top:2px solid #111111;
}
.srv-workflow-line {
  font: 500 16px/1.4 var(--font-display),sans-serif; color:#111111; margin:0;
  padding:14px 0; border-bottom:1px solid #B8B9B5;
}
.srv-workflow-line:last-of-type { border-bottom:none; }
.srv-custom-body-stack { display:flex; flex-direction:column; gap:14px; margin-top:20px; }
.srv-custom-body { margin:0; font: 400 16px/1.6 var(--font-display),sans-serif; color:#5F6466; }
.srv-custom-kicker-wrap { margin-top:18px; }

/* ── §7 Process ledger ──────────────────────────────── */
.srv-ledger-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(300px,100%),1fr));
  gap:0 28px;
}
.srv-ledger-row {
  display:grid;
  grid-template-columns: auto 1fr;
  gap:0 0;
  padding:28px 0; border-top:1px solid #B8B9B5; align-items:baseline;
}
.srv-ledger-row:first-child { border-top:none; }
.srv-ledger-cell1 { display:flex; align-items:baseline; gap:0; padding-right:16px; }
.srv-ledger-n {
  font: 400 12px/1 ui-monospace,'Cascadia Code','Source Code Pro',monospace;
  color:#5F6466; width:46px; flex:none;
}
.srv-ledger-name-stack { display:flex; flex-direction:column; gap:6px; }
.srv-ledger-name { margin:0; font: 600 21px/1.2 var(--font-display),sans-serif; letter-spacing:-.022em; color:#111111; }
.srv-ledger-imp { margin:0; font: 500 16px/1.4 var(--font-display),sans-serif; color:#111111; }
.srv-ledger-body { font: 400 15px/1.6 var(--font-display),sans-serif; color:#5F6466; margin:0; }
.srv-ledger-qs { display:flex; flex-direction:column; gap:6px; }
.srv-ledger-q { margin:0; font: 400 15px/1.5 var(--font-display),sans-serif; color:#5F6466; }
.srv-process-close {
  margin-top:30px; padding-top:30px; border-top:2px solid #111111;
  font: 600 19px/1.35 var(--font-display),sans-serif; letter-spacing:-.015em; color:#111111; margin-bottom:0;
}

/* ── §8 Limits — close kicker ───────────────────────── */
.srv-limits-kicker {
  border-left:2px solid #476776; padding-left:14px;
  font: 600 19px/1.35 var(--font-display),sans-serif; color:#111111; margin:0;
}

/* ── §9 Background ──────────────────────────────────── */
.srv-bg-two-col {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px,100%),1fr));
  gap:28px 48px; align-items:start;
  padding-bottom:44px;
}
.srv-bg-right {
  border-top:2px solid #111111; padding-top:24px;
  display:flex; flex-direction:column; gap:16px;
}
.srv-bg-lead { margin:0; font: 500 17px/1.5 var(--font-display),sans-serif; color:#111111; }
.srv-bg-body { margin:0; font: 400 16px/1.6 var(--font-display),sans-serif; color:#5F6466; }

/* ── §9b Thesis band ────────────────────────────────── */
.srv-thesis-band {
  background:#111111; padding:34px 0;
}
.srv-thesis {
  margin:0; font: 600 clamp(22px,3.4vw,30px)/1.25 var(--font-display),sans-serif;
  letter-spacing:-.028em; color:#FFFFFF; max-width:32ch; text-wrap:balance;
}

/* ── §10 Closing CTA ────────────────────────────────── */
.srv-closing-grid {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(min(340px,100%),1fr));
  gap:36px 56px; align-items:start;
}
.srv-closing-lockup {
  display:flex; align-items:center; gap:10px; margin-bottom:28px;
}
.srv-closing-lockup__rule { flex:1; height:1px; background:#5F6466; }
.srv-closing-label {
  font: 600 14px/1 var(--font-display),sans-serif; letter-spacing:.14em;
  text-transform:uppercase; color:#FFFFFF; margin:0; white-space:nowrap;
}
.srv-closing-h2 {
  margin:0; font: 600 clamp(32px,10cqi,58px)/0.99 var(--font-display),sans-serif;
  letter-spacing:-.042em; color:#FFFFFF; text-wrap:balance;
}
.srv-closing-col { container-type:inline-size; }
.srv-candidates { list-style:none; padding:0; margin:24px 0 24px; }
.srv-candidates li {
  font: 500 16px/1.4 var(--font-display),sans-serif; color:#FFFFFF;
  padding:13px 0; border-top:1px solid #5F6466;
}
.srv-candidates li:last-child { border-bottom:none; }
.srv-closing-note {
  margin:0 0 20px; font: 400 19px/1.4 var(--font-display),sans-serif;
  color:#B8B9B5; max-width:46ch;
}
.srv-closing-kicker {
  border-left:2px solid #FFFFFF; padding-left:12px;
  display:flex; flex-direction:column; gap:8px; margin-bottom:28px;
}
.srv-closing-kicker__main {
  margin:0; font: 600 19px/1.35 var(--font-display),sans-serif; color:#FFFFFF;
}
.srv-closing-kicker__sub {
  margin:0; font: 400 16px/1.5 var(--font-display),sans-serif; color:#B8B9B5;
}

/* Rail (right column) */
.srv-rail { display:flex; flex-direction:column; }
.srv-rail-label {
  font: 500 12px/1 var(--font-display),sans-serif; letter-spacing:.12em;
  text-transform:uppercase; color:#B8B9B5; margin:0 0 16px;
}
.srv-rail-row {
  display:flex; align-items:baseline; gap:12px;
  padding:16px 0; border-top:1px solid #5F6466;
}
.srv-rail-n {
  font: 400 12px/1 ui-monospace,'Cascadia Code','Source Code Pro',monospace;
  color:#B8B9B5; flex:none;
}
.srv-rail-stack { display:flex; flex-direction:column; gap:4px; }
.srv-rail-name { margin:0; font: 600 17px/1.2 var(--font-display),sans-serif; color:#FFFFFF; }
.srv-rail-promise { margin:0; font: 400 14px/1.4 var(--font-display),sans-serif; color:#B8B9B5; }

/* General link style */
a { color:#476776; }
a:hover { color:#111111; }

    toggle.setAttribute('aria-expanded', open);
  });

  if (!dd) return;

  var openTimer, closeTimer;

  function openPanel() {
    clearTimeout(closeTimer);
    dd.classList.add('is-open');
    btn.setAttribute('aria-expanded', 'true');
  }

  function closePanel() {
    clearTimeout(openTimer);
    dd.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    clearTimeout(openTimer); clearTimeout(closeTimer);
    dd.classList.contains('is-open') ? closePanel() : openPanel();
  });

  btn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dd.classList.contains('is-open') ? closePanel() : openPanel(); }
  });

  dd.addEventListener('mouseenter', function () {
    if (window.innerWidth < 900) return;
    clearTimeout(closeTimer);
    openTimer = setTimeout(openPanel, 120);
  });

  dd.addEventListener('mouseleave', function () {
    if (window.innerWidth < 900) return;
    clearTimeout(openTimer);
    closeTimer = setTimeout(closePanel, 200);
  });

  btn.addEventListener('keydown', function (e) {
    if (!dd.classList.contains('is-open')) return;
    var items = Array.prototype.slice.call(panel.querySelectorAll('.cos-nav__item'));
    if (e.key === 'ArrowDown') { e.preventDefault(); if (items[0]) items[0].focus(); }
    if (e.key === 'Escape') { closePanel(); btn.focus(); }
  });

  panel.addEventListener('keydown', function (e) {
    var items = Array.prototype.slice.call(panel.querySelectorAll('.cos-nav__item'));
    var idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); if (idx < items.length - 1) items[idx + 1].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); if (idx > 0) items[idx - 1].focus(); else btn.focus(); }
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); btn.focus(); }
    if (e.key === 'Tab') { closePanel(); }
  });

  document.addEventListener('click', function (e) {
    if (!dd.contains(e.target)) closePanel();
  });
})();
</script>
